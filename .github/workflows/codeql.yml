name: CodeQL

# Semantic analysis of Janus's own first-party code (injection, unsafe
# patterns, etc.) -- a genuinely different layer from security-audit.yml's
# cargo-audit/npm-audit, which only catch known-CVE dependency *versions*
# and say nothing about vulnerabilities in code Janus itself wrote. Same
# push+weekly-schedule cadence as security-audit.yml, for the same reason:
# a query pack update can surface a new finding against unchanged code.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 7 * * 1' # every Monday 07:00 UTC (staggered after security-audit.yml's 06:00)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A newer commit on the same PR supersedes the older run, so cancel it.
# Master pushes, the weekly schedule and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:${{ matrix.language }}'
