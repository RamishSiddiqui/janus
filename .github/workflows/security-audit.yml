name: Security audit

# Catches known-vulnerable dependencies immediately when Cargo.lock/package.json
# change, AND on a weekly schedule — the schedule matters because a dependency
# that was clean when pinned can have a new advisory published against it
# later, with nothing in this repo changing to trigger a push-based check.

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # RUSTSEC-2026-0235 (rkyv <0.8 archive validation): pulled in
          # transitively via surrealdb-core -> rust_decimal's optional rkyv
          # feature, pinned to the 0.7 line. No patched 0.7.x release exists —
          # the fix is rkyv 0.8, a breaking migration upstream hasn't made
          # yet. Revisit and drop this once surrealdb-core updates.
          ignore: RUSTSEC-2026-0235

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
