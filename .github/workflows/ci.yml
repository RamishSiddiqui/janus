name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit on the same PR supersedes the older run, so cancel it. Pushes
# to master get their own group per commit and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Errors fail the build; warnings are a visible backlog (see eslint.config.js).
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  backend:
    name: Backend (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      # Formatting needs only rustfmt, so check it first and fail in seconds
      # instead of after the system packages, frontend build and compile.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # `tauri build` refuses to run when a Tauri plugin's npm package and Rust
      # crate differ in major/minor, and neither cargo nor npm notices. That
      # first showed up as a failed release, so check it on every PR. `tauri
      # info` prints the mismatch but still exits 0, so look at its output.
      - name: Tauri npm packages match their Rust crates
        run: |
          npx tauri info 2>&1 | tee tauri-info.txt
          if grep -q "version mismatched" tauri-info.txt; then
            echo "::error::A Tauri npm package and its Rust crate are on different minor versions; update them together."
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # clippy compiles every target `cargo check --all-targets` would, and
      # fails on warnings too, so a separate check step only repeated the work.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
