name: Gitleaks

# Ongoing secret-scan safeguard. A one-time full-history gitleaks audit
# already confirmed the existing history is clean (no rewrite needed) --
# this workflow is what actually prevents a *future* accidental commit (an
# API key pasted into a debug log, a stray .env, etc.) from landing
# unnoticed. Scans the diff on every push/PR rather than full history each
# time, since history is already known-clean and re-scanning it on every
# run would just be redundant cost.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
