name: Docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "src/**", "src-tauri/src/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "src/**", "src-tauri/src/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build docs (Sphinx + Furo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # The reference pages are generated from the source and must be committed
      # up to date; this also enforces documentation coverage (every command,
      # endpoint, setting and source file described).
      - run: python docs/tools/gen_reference.py --check
      # -W turns warnings (broken links and references) into failures.
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs/_build/html
