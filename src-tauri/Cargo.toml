[package]
name = "janus"
version = "0.1.0"
description = "Open-source LLM-powered role-playing desktop app with image and video generation"
authors = ["Janus Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "janus"

[lib]
name = "janus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# LLM Framework (unified provider abstraction for 17+ providers)
rig-core = { version = "0.41", features = ["derive", "image"] }
# rig-core >= 0.41 split the Agent/Chat/StreamingChat convenience layer out
# into this sibling crate — rig-core alone only has the low-level
# CompletionModel API now. Same trait names/signatures as before, just a
# different crate path.
rig-agent = { version = "0.41", features = ["derive"] }

# HTTP client (for non-LLM HTTP calls: image gen, health checks)
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }

# MCP client (WanGP image/video generation talks MCP over streamable-http, not plain REST)
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

# Database
surrealdb = { version = "3.2.4", features = ["kv-rocksdb"] }

# Rust -> TypeScript type generation for the Tauri IPC boundary
specta = { version = "2.0.0-rc", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Image processing (for character card PNG embedding)
image = "0.25"
png = "0.18"
base64 = "0.23"

# Async traits
async-trait = "0.1"

# Token counting
tiktoken-rs = "0.12"

# Regex (for response parsing)
regex = "1"

# Streaming
futures = "0.3"
tokio-stream = "0.1"

# Native TTS (Kokoro-82M, embedded in-process via ONNX Runtime — no
# external server, see src/tts/ and GitHub issue #66). `ort` is still
# pre-1.0 (rc) but has been for a long time and is the de facto standard
# Rust ONNX binding; `misaki-rs` with espeak disabled is the pure-Rust
# phonemizer that avoids needing an `espeak-ng` system dependency, which
# has no clean Windows story.
#
# `load-dynamic` (not `download-binaries`): `download-binaries` statically
# links a prebuilt ONNX Runtime that was compiled against a newer MSVC STL
# than this machine's linker has, producing ~20 unresolved
# `__std_search_1`/`__std_max_element_f`-style externals at link time
# (MSVC's vectorized <algorithm> helpers). `load-dynamic` instead loads
# `onnxruntime.dll` at runtime via `ort::init_from(path)?.commit()`
# (src/tts/engine.rs) — no ONNX Runtime C++ code gets linked into
# janus_lib.dll at compile time, so the STL mismatch never applies. The
# dll itself is fetched by `src/tts/download.rs` alongside the model/voice
# pack, pinned to the exact ONNX Runtime release (1.28.0) that
# `download-binaries` itself would have fetched for this ort-sys version
# (see build/download/dist.tsv in the ort-sys source: `ms@1.28.0`) — same
# ABI, just loaded dynamically instead of linked statically.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false, features = ["npz"] }
misaki-rs = { version = "0.3", default-features = false }
hound = "3.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# This crate compiles staticlib+cdylib+rlib together with full debug info
# (the tauri-cli default), which pushes LLVM codegen's peak memory high
# enough to reliably OOM-crash on memory-constrained machines. Logging
# (tracing, Settings > Logging) is this app's primary debugging tool, not a
# source-level debugger, so trading rich debug symbols for a build that
# actually completes is the right call here.
debug = 0

[profile.release]
opt-level = "z"       # Optimize for binary size
lto = true            # Link-time optimization
strip = true          # Strip debug symbols
codegen-units = 1     # Better optimization (slower compile)
panic = "abort"       # No unwinding overhead
