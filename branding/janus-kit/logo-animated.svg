<svg xmlns="http://www.w3.org/2000/svg" viewBox="-61 -83 122 166" width="122" height="166" role="img" aria-label="Janus">
  <!-- Standalone port of src/lib/components/JanusLoader.svelte for use outside
       Svelte (README, social previews, etc.) — same path data, same gradient,
       same animation timing. If the component's animation ever changes,
       update this file to match. -->
  <defs>
    <linearGradient id="janus-split" gradientUnits="userSpaceOnUse" x1="0" y1="-80" x2="0" y2="80">
      <stop offset="0" stop-color="#CDA15F" />
      <stop offset="0.485" stop-color="#CDA15F" />
      <stop offset="0.515" stop-color="#9075F2" />
      <stop offset="1" stop-color="#9075F2" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="18" stroke-linecap="round">
    <path stroke="url(#janus-split)" opacity="0.22"
      d="M -52,52 Q -52,74 -30,74 Q 0,74 0,46 L 0,-46 Q 0,-74 30,-74 Q 52,-74 52,-52" />
    <path class="run" stroke="url(#janus-split)" pathLength="100" stroke-dasharray="62 200"
      d="M -52,52 Q -52,74 -30,74 Q 0,74 0,46 L 0,-46 Q 0,-74 30,-74 Q 52,-74 52,-52" />
  </g>
  <style>
    .run {
      animation: janus-run 2.6s linear infinite, janus-fade 2.6s linear infinite;
    }
    @keyframes janus-run  { from { stroke-dashoffset: 62; } to { stroke-dashoffset: -100; } }
    @keyframes janus-fade { 0%, 100% { opacity: 0; } 11%, 89% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .run { animation: none; stroke-dasharray: none; opacity: 1; }
    }
  </style>
</svg>
